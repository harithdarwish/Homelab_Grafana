global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

# Multiple machines grouped under one job:
  - job_name: 'remote-nodes'
    static_configs:
      - targets: 
          - '192.168.0.52:9100'
         # - '192.168.0.53:9100'
